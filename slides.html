<!DOCTYPE html>
<html>
<head>
<title>Slide Show</title>
<link type="text/css" rel="stylesheet" href="scripts/slides2.2.css" />
<link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
<script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>
<script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
<script src="scripts/slides3.1.js"></script>
</head>
<body>
<center>
<div id="frame" class="frame"><br />
	<div id="box" class="box">
		<div id="title" class="title"></div>
		<center><img id="pic" class="pic" alt="" /></center>
		<img id="pause" class="pause" src="images/pause.png">
		<div id="cap" class="cap"></div>
	</div>
	<div id="prev" class="prev">
		<img id="arrl" class="arrl" src="images/arr_left.png">
	</div>
	<div id="next" class="next">
		<img id="arrr" class="arrr" src="images/arr_right.png">
	</div>
	<div id="sett" class="sett">
		<img id="conf" class="conf" src="images/gears.png">
	</div>
	<div id="panl" class="panl">
		<span id="slow" class="slow">slow</span>
		<div id="bar" class="bar"></div>
		<img id="dot" class="dot" src="images/light_green.png">
		<span id="fast" class="fast">fast</span>
		<img id="resize" class="resize" src="images/enlarge.png" title="enlarge">
	</div>
	<div id="cnt" class="cnt">
		<div class="blef">[</div>
		<div id="idx" class="idx"></div>
		<div class="brgt">]</div>
	</div>
	<div id="prg" class="prg">
		<div id="cir1" class="cir"></div>
		<div id="cir2" class="cir"></div>
		<div id="cir3" class="cir"></div>
		<div id="cir4" class="cir"></div>
		<div id="cir5" class="cir"></div>
	</div>
</div>
</center>
<img id="alb" src="images/album64a.png" title="Albums">
<img id="shw" src="images/frame64a.png" title="Gallery Show">
<div id="pnl">
<!--
<p class="lnk" onclick="openAlbum('home')">Home</p>
<p class="lnk" onclick="openAlbum('icefire')">Ice and Fire</p>
<p class="lnk" onclick="openAlbum('cranes')">Cranes</p>
<p class="lnk" onclick="openAlbum('roses')">Roses</p>
<p class="lnk" onclick="openAlbum('cosmos')">Cosmos</p>
<p class="lnk" onclick="openAlbum('chive')">Chive Flowers</p>
<p class="lnk" onclick="openAlbum('flowers')">Wild Flowers</p>
<p class="lnk" onclick="openAlbum('lockett')">Lockett Meadow</p>
-->

<div id="msg" style="position:absolute; left:20px; top:50px; width:220px; height:115px; padding:10px; background-color:white; font-family:arial; font-size:10pt; display:none; border:1px solid gray; border-radius:6px; box-shadow:1px 1px 6px #808080;">
	<ol style="margin-top:5px; margin-left:-2em; cursor:default;">
	<li>Move mouse cursor over the movie screen to show play controls: previous photo, next photo, and pause/play.</li>
	<li>Move mouse cursor to the lower-left corner of the movie screen to show the settings (cog) icon: play faster/slower and enlarge/restore photo size.</li>
	</ol>
	<div id="xmsg" style="position:absolute; top:-2px; right:2px; font-size:16pt; color:gray; cursor:pointer;">&#215;</div>
</div>
</div>
</body>
</html>
